name: CI

on:
  push:
  pull_request:

# ⚠️⚠️ ไม่มีบล็อกนี้ = push ถี่ ๆ ทำให้รอบเก่ากับรอบใหม่แย่งคิวกันเอง
#
# วัดจริง 2 ครั้ง: งานทั้ง 5 ถูกยกเลิกพร้อมกันเป๊ะวินาทีเดียวกันที่นาทีที่ 15
# โดย **ไม่ได้รันสักขั้นตอนเดียว** (0 จาก 0 ขั้นตอน) — คือรอเครื่องจนหมดเวลา
# ผลคือคอมมิตนั้นขึ้นว่า "failure" ทั้งที่โค้ดไม่มีอะไรผิด ซึ่งอ่านแล้วเข้าใจผิด
# ได้ง่ายมาก และทำให้ไม่รู้ว่าคอมมิตไหนถูกตรวจจริงบ้าง
#
# ตั้งแบบนี้แล้ว push ใหม่จะยกเลิกรอบเก่าอย่างตั้งใจ (ระบุเหตุผลชัด) และ
# คอมมิตล่าสุดได้เครื่องรันเสมอ ซึ่งเป็นตัวที่เราสนใจจริง ๆ
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── job 1: static analysis + unit tests (ไม่ต้องใช้ DB) ──────────────────────
  quality:
    name: Quality (PHPStan + Unit)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      # PHPUnit 13.x require PHP >= 8.4.1 → CI ต้องใช้ 8.4 ขึ้นไป
      # (โค้ด production รองรับ 8.2+ แต่ dev dependency บังคับ 8.4)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, zip, gd
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPStan (level 3, ต้อง 0 error)
        run: composer stan

      - name: Unit tests (ไม่แตะ DB)
        run: vendor/bin/phpunit --testsuite Unit

  # ── job 3: syntax lint บน PHP 8.2 (ปิด gap: เทสต์จริงรันได้แค่ 8.4+) ─────────
  #    PHPUnit 13 require php >= 8.4.1 → ลง dependency บน 8.2 ไม่ได้
  #    job นี้จึงไม่ composer install แค่ php -l ทุกไฟล์ เพื่อพิสูจน์ว่า
  #    ไม่มี syntax ที่ PHP 8.2 (เวอร์ชันต่ำสุดที่โปรเจกต์รองรับ) ไม่รู้จัก
  #    ⚠️ พิสูจน์แค่ระดับ syntax — ไม่ครอบ runtime behavior บน 8.2
  lint-php83:
    name: Syntax lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # ⚠️⚠️ 8.3 คือ **เพดานล่างจริง** ไม่ใช่ 8.2
    #
    # เดิม lint ที่ 8.2 ด้วย โดยเข้าใจว่า composer.json ประกาศ ">=8.2" ไว้ — แต่ job นี้
    # รันแค่ `php -l` **ไม่เคยติดตั้ง dependency เลย** จึงเขียวตลอดทั้งที่ติดตั้งจริงบน 8.2 ไม่ได้:
    #   maennchen/zipstream-php 3.2.2 (phpoffice/phpspreadsheet ลากมา) require php-64bit ^8.3
    # ⚠️ มันประกาศไว้ใต้คีย์ `php-64bit` ไม่ใช่ `php` — อ่าน composer.lock เผิน ๆ จะมองไม่เห็น
    #
    # ถ้าจะกลับไปรองรับ 8.2 ต้องถอย zipstream เป็น 2.x ก่อน แล้วค่อยเพิ่ม '8.2' กลับเข้า matrix
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: php -l ทุกไฟล์ (app/, includes/, api/, cron/, root *.php)
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=${file}::syntax error"
              php -l "$file" || true
              status=1
            fi
          done < <(
            find app includes api cron -type f -name '*.php' -print0
            find . -maxdepth 1 -type f -name '*.php' -print0
          )
          if [ "$status" -eq 0 ]; then
            echo "✅ ทุกไฟล์ผ่าน php -l บน $(php -r 'echo PHP_VERSION;')"
          fi
          exit $status

  # ── job 2: integration tests (ต้องมี MariaDB จริง) ──────────────────────────
  integration:
    name: Integration (MariaDB 10.4)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # ใช้ mariadb:10.4 ให้ตรงกับ dev environment
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_DATABASE: ad_profit_test
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, zip, gd
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # รอ MariaDB พร้อมรับ connection (ใช้ PDO — ไม่ต้องลง mysql client บน runner)
      - name: Wait for MariaDB
        run: |
          php -r '
          for ($i = 0; $i < 30; $i++) {
              try {
                  new PDO("mysql:host=127.0.0.1;port=3306;dbname=ad_profit_test", "root", "root");
                  echo "MariaDB ready\n";
                  exit(0);
              } catch (Throwable $e) {
                  sleep(2);
              }
          }
          fwrite(STDERR, "MariaDB not ready in time\n");
          exit(1);
          '

      # ❗ ไม่มี step seed schema โดยตั้งใจ:
      #    tests/Integration/IntegrationTestCase.php (setUpBeforeClass → loadSchema)
      #    โหลด database/schema.sql เข้า test DB ให้เองอยู่แล้ว โดย split เป็น statement
      #    แล้วข้าม `CREATE DATABASE` / `USE` (schema hardcode ชื่อ DB จริง `ad_profit`)
      #    ⚠️ อย่าเผลอ seed ด้วย `grep -v '^CREATE DATABASE' | mysql` — `CREATE DATABASE`
      #       ในไฟล์นี้กินพื้นที่ 3 บรรทัด (มี CHARACTER SET / COLLATE ต่อท้าย) การ grep
      #       ทีละบรรทัดจะเหลือเศษ SQL ค้าง → import พังทันที
      #    job นี้จึงต้องการแค่ "ให้ DB ว่างชื่อ ad_profit_test มีอยู่" (สร้างโดย MARIADB_DATABASE)
      - name: Integration tests
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '3306'
          TEST_DB_NAME: ad_profit_test
          TEST_DB_USER: root
          TEST_DB_PASS: root
        run: vendor/bin/phpunit --testsuite Integration

  # ── job 4: คำสั่งติดตั้งของ production ต้องใช้ได้จริงบนเวอร์ชันของเซิร์ฟเวอร์จริง ──
  #    เอกสาร deploy บอกให้รัน `composer install --no-dev` บน PHP 8.3
  #    ⚠️ ถ้าลืมใส่ `--no-dev` คำสั่งจะล้มทั้งคำสั่ง (PHPUnit 13 ต้องการ 8.4+)
  #       แล้ว **ไม่ได้ vendor/ เลยสักตัว** · อาการหลังจากนั้นอ่านยากมากเพราะเว็บยัง
  #       เปิดได้ปกติ แต่ดาวน์โหลด Excel พังและอีเมลรีเซ็ตรหัสส่งไม่ออก เงียบทั้งคู่
  #    job นี้จึงยืนยัน 2 อย่าง: ติดตั้งผ่าน และไลบรารีที่หน้าเว็บต้องใช้โหลดได้จริง
  prod-install:
    name: คำสั่งติดตั้งของ production (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP 8.3 (extension เท่าที่ production มี)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, zip, gd, dom, fileinfo, iconv, simplexml, xmlreader, xmlwriter, zlib
          coverage: none

      - name: composer install --no-dev (คำสั่งเดียวกับที่เอกสาร deploy บอก)
        run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction

      - name: ไลบรารีที่หน้าเว็บต้องใช้ต้องโหลดได้จริง
        run: |
          php -r '
            require "vendor/autoload.php";
            $missing = [];
            foreach ([
                "PhpOffice\\PhpSpreadsheet\\Spreadsheet" => "ดาวน์โหลดไฟล์ Excel",
                "PHPMailer\\PHPMailer\\PHPMailer"        => "อีเมลรีเซ็ตรหัสผ่าน",
            ] as $class => $feature) {
                if (!class_exists($class)) {
                    $missing[] = $feature . " (" . $class . ")";
                }
            }
            if ($missing !== []) {
                fwrite(STDERR, "ฟีเจอร์ที่จะพังเงียบ ๆ บน production: " . implode(", ", $missing) . "\n");
                exit(1);
            }
            echo "✅ ไลบรารีครบ — Excel และอีเมลใช้งานได้\n";
          '

  # ── job 5: โค้ดของเราต้อง "รันได้จริง" บนเวอร์ชันที่เซิร์ฟเวอร์จริงใช้ ────────
  #    ⚠️⚠️ ช่องว่างที่ job อื่นปิดไม่ได้:
  #      · lint-php83   พิสูจน์แค่ syntax
  #      · prod-install พิสูจน์แค่ว่าติดตั้ง dependency ได้
  #      · integration  รัน runtime จริง แต่ต้องใช้ PHP 8.4+ (PHPUnit 13 บังคับ)
  #    → พฤติกรรมตอนรันของโค้ดเราเอง **บน 8.3 ซึ่งเป็นเวอร์ชันของ production**
  #      ไม่เคยมีใครพิสูจน์เลย · job นี้ยกเซิร์ฟเวอร์จริงแล้วเปิดทุกหน้าดู
  smoke-php83:
    name: Smoke test หน้าเว็บจริง (PHP 8.3 = เวอร์ชันของ production)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_DATABASE: ad_profit_smoke
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP 8.3 (extension เท่าที่ production มี)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, zip, gd, curl
          coverage: none

      # ใช้ชุด production — ไม่ใช่ชุด dev ที่มี PHPUnit (ซึ่งลงบน 8.3 ไม่ได้อยู่แล้ว)
      - name: composer install --no-dev
        run: composer install --no-dev --optimize-autoloader --no-progress --no-interaction

      - name: รอ MariaDB แล้วโหลด schema
        run: |
          php -r '
          $pdo = null;
          for ($i = 0; $i < 30; $i++) {
              try { $pdo = new PDO("mysql:host=127.0.0.1;port=3306;dbname=ad_profit_smoke", "root", "root"); break; }
              catch (Throwable $e) { sleep(2); }
          }
          if ($pdo === null) { fwrite(STDERR, "MariaDB ไม่พร้อมในเวลาที่กำหนด\n"); exit(1); }

          // ⚠️ ต้องแยกเป็น statement แล้วข้าม CREATE DATABASE / USE
          //    (schema.sql hardcode ชื่อ DB จริง `ad_profit` และ CREATE DATABASE กิน 3 บรรทัด
          //     การ grep ทีละบรรทัดจะเหลือเศษ SQL ค้าง → import พังทันที)
          $sql = file_get_contents("database/schema.sql");
          foreach (explode(";", $sql) as $statement) {
              $head = strtoupper(ltrim(preg_replace("/^\s*(--[^\n]*\n)+/", "", $statement)));
              if (trim($statement) === "" || str_starts_with($head, "CREATE DATABASE") || str_starts_with($head, "USE ")) {
                  continue;
              }
              $pdo->exec($statement);
          }
          echo "✅ โหลด schema แล้ว\n";
          '

      # ⚠️ ต้องเป็น APP_ENV=development ไม่งั้น display_errors ปิดอยู่
      #    คำเตือนจะไม่ถูกพิมพ์ออกมา แล้ว smoke test จะเขียวโดยไม่ได้ตรวจอะไรเลย
      - name: ยกเซิร์ฟเวอร์แล้วเปิดทุกหน้า
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: ad_profit_smoke
          DB_USER: root
          DB_PASS: root
          APP_ENV: development
        run: |
          php -d error_reporting=E_ALL -S 127.0.0.1:8080 -t . > /tmp/smoke-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/login.php; then break; fi
            sleep 1
          done

          php tests/smoke/pages.php http://127.0.0.1:8080
          status=$?

          if [ "$status" -ne 0 ]; then
            echo "── log ของเซิร์ฟเวอร์ ──"
            tail -40 /tmp/smoke-server.log
          fi
          exit $status
